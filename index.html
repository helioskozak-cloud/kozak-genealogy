<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kozak Family — the ancestry of Grant Kozak</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Everything on this page is rendered from data/family.json at runtime.
   Nothing is hand-authored. That is the point: the previous version kept the
   pedigree in an inline JS array AND in the data file, and kept seven nights
   of research as inert HTML the data had never heard of — so research could
   exist and simply not appear. One source, or none.
   No D3, no build step, no dependencies.
   ───────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fa; --card:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --accent:#1d4ed8;
  --kozak:#15803d; --kozak-bg:#dcfce7; --kozak-b:#86efac;
  --rel:#7e22ce;   --rel-bg:#f3e8ff;   --rel-b:#d8b4fe;
  --shom:#0369a1;  --shom-bg:#e0f2fe;  --shom-b:#7dd3fc;
  --mcg:#be185d;   --mcg-bg:#fce7f3;   --mcg-b:#f9a8d4;
  --other:#b45309; --other-bg:#fef3c7; --other-b:#fcd34d;
  --none:#475569;  --none-bg:#f1f5f9;  --none-b:#cbd5e1;
}
body{font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);
     color:var(--ink);font-size:14.5px;line-height:1.5}
a{color:var(--accent)}
nav{position:sticky;top:0;z-index:50;background:#0f172a;display:flex;align-items:center;
    gap:2px;padding:0 16px;flex-wrap:wrap}
nav .brand{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;
    color:#f8fafc;margin-right:18px;padding:13px 0}
nav button,nav a.navlink{background:none;border:0;color:#94a3b8;font:inherit;font-size:13px;
    font-weight:600;padding:13px 12px;cursor:pointer;border-bottom:3px solid transparent;
    text-decoration:none;display:inline-block}
nav button:hover,nav a.navlink:hover{color:#e2e8f0}
nav button.on{color:#fff;border-bottom-color:#60a5fa}
main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin-bottom:4px}
.lede{color:var(--ink2);font-size:13.5px;margin-bottom:20px;max-width:76ch}
h2{font-family:'Playfair Display',Georgia,serif;font-size:19px;margin:26px 0 8px}
.pane{display:none} .pane.on{display:block}

/* generation rows — plain boxes, no chart library */
.gen{margin-bottom:18px}
.gen-h{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
       color:var(--ink3);margin-bottom:8px;display:flex;align-items:center;gap:9px}
.gen-h::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,238px),1fr));
     gap:9px;align-items:start}  /* or a short card stretches to match a tall neighbour */
.p{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:9px;
   padding:9px 11px;cursor:pointer;text-align:left;font:inherit;width:100%;transition:.12s;
   color:var(--ink)}
.p:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.09)}
.p .nm{font-weight:600;font-size:13.5px;line-height:1.3}
.p .dt{font-size:11.5px;color:var(--ink2);margin-top:2px}
.p .rl{font-size:11px;color:var(--ink3);margin-top:3px}
.p.prob{border-style:dashed}
.p.b-kozak{border-left-color:var(--kozak)} .p.b-rel{border-left-color:var(--rel)}
.p.b-shom{border-left-color:var(--shom)}   .p.b-mcg{border-left-color:var(--mcg)}
.p.b-other{border-left-color:var(--other)} .p.b-none{border-left-color:var(--none-b)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;padding:1px 6px;border-radius:20px;border:1px solid;margin-left:6px;
      vertical-align:1px;white-space:nowrap}
.c-kozak{background:var(--kozak-bg);color:var(--kozak);border-color:var(--kozak-b)}
.c-rel{background:var(--rel-bg);color:var(--rel);border-color:var(--rel-b)}
.c-shom{background:var(--shom-bg);color:var(--shom);border-color:var(--shom-b)}
.c-mcg{background:var(--mcg-bg);color:var(--mcg);border-color:var(--mcg-b)}
.c-other{background:var(--other-bg);color:var(--other);border-color:var(--other-b)}
.c-none{background:var(--none-bg);color:var(--none);border-color:var(--none-b)}
.c-prob{background:#fef3c7;color:#92400e;border-color:#fcd34d}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search],select{font:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line);
   border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{flex:1;min-width:220px}
.count{color:var(--ink3);font-size:12.5px;margin-left:auto}

.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
        margin-bottom:16px}
.detail h3{font-family:'Playfair Display',Georgia,serif;font-size:22px;margin-bottom:2px}
.detail .sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:152px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink3);font-weight:700;font-size:11px;text-transform:uppercase;
       letter-spacing:.05em;padding-top:3px}
.rel-list{display:flex;flex-wrap:wrap;gap:6px}
.rel-list button{font:inherit;font-size:12.5px;background:var(--none-bg);border:1px solid var(--line);
       border-radius:20px;padding:3px 11px;cursor:pointer;color:var(--ink)}
.rel-list button:hover{border-color:var(--accent);color:var(--accent)}
.blk{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.blk h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);
        margin-bottom:8px;font-weight:700}
.src{border-left:3px solid var(--line);padding:2px 0 2px 11px;margin-bottom:10px;font-size:13px}
.src .sn{font-weight:600}
.src .meta{color:var(--ink3);font-size:11.5px;margin-top:1px}
.src.cc{border-left-color:#16a34a} .src.cp{border-left-color:#d97706} .src.ci{border-left-color:#dc2626}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);
   padding:9px 11px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid #f1f5f9;vertical-align:top}
tr:last-child td{border-bottom:0}
.part{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;
      margin-bottom:10px}
.part .pn{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.part .pt{font-weight:600;margin:3px 0 5px;font-size:14px}
.part .ps{font-size:13px;color:var(--ink2)}
.empty{color:var(--ink3);padding:26px;text-align:center;background:var(--card);
       border:1px solid var(--line);border-radius:10px}
.note{background:#fffbeb;border:1px solid #fcd34d;border-radius:9px;padding:11px 14px;
      font-size:13px;color:#78350f;margin:16px 0}
@media(max-width:640px){ .kv{grid-template-columns:1fr;gap:1px 0} .kv dt{margin-top:9px} }
</style>
</head>
<body>
<nav>
  <span class="brand">Kozak Family</span>
  <button data-p="ancestry" class="on">Ancestry</button>
  <button data-p="people">People</button>
  <button data-p="sources">Sources</button>
  <button data-p="research">Research log</button>
  <button data-p="questions">Open questions</button>
  <a class="navlink" href="research-log.html">Full session notes &rarr;</a>
</nav>
<main>
  <div id="boot" class="empty">Loading <code>data/family.json</code>&hellip;</div>
  <section id="pane-ancestry" class="pane on"></section>
  <section id="pane-people" class="pane"></section>
  <section id="pane-sources" class="pane"></section>
  <section id="pane-research" class="pane"></section>
  <section id="pane-questions" class="pane"></section>
</main>

<script>
"use strict";
const ROOT = "grant-1";
let D = null, P = null;

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = id => document.getElementById(id);

/* ── identity ───────────────────────────────────────────────────────────
   One human can appear in more than one research tree — Thomas P. Relihan
   is both grant-4 and tpr-1. `sameAs` links them; canon() picks whichever
   record carries more, so a click never lands on the thin copy. */
function canon(id){
  const a = P[id]; if(!a) return id;
  const b = a.sameAs && P[a.sameAs];
  if(!b) return id;
  const score = p => (p.facts||[]).length*2 + (p.parents||[]).length + (p.note?1:0);
  return score(b) > score(a) ? a.sameAs : id;
}
const nameOf = id => (P[canon(id)]||{}).name || "Unknown";
let ALL = [];
const branchOf = id => ((P[canon(id)]||{}).branch) || "none";

function parentsOf(id){
  const seen=new Set(), out=[];
  for(const src of [id, P[id]&&P[id].sameAs].filter(Boolean))
    for(const x of ((P[src]||{}).parents)||[]){
      const c=canon(x); if(!seen.has(c)){ seen.add(c); out.push(c); }
    }
  return out;
}
let KIDS = null;
function buildKids(){
  KIDS = {};
  for(const id of ALL) for(const p of parentsOf(id)) (KIDS[p] ||= []).push(id);
}
const childrenOf = id => KIDS[canon(id)] || [];
function spousesOf(id){
  const out=new Set();
  for(const c of childrenOf(id)) for(const p of parentsOf(c))
    if(p!==canon(id)) out.add(p);
  return [...out];
}

function card(id){
  const p = P[canon(id)] || {};
  return `<button class="p b-${esc(branchOf(id))}${p.prob?" prob":""}" data-go="${esc(canon(id))}">
    <div class="nm">${esc(p.name||"Unknown")}${p.prob?'<span class="chip c-prob">probable</span>':""}</div>
    ${p.note?`<div class="dt">${esc(p.note)}</div>`:""}
    ${p.relation?`<div class="rl">${esc(p.relation)}</div>`:""}
  </button>`;
}

/* ── ANCESTRY ──────────────────────────────────────────────────────────── */
const GEN_LABEL = ["Grant Kozak","Parents","Grandparents","Great-grandparents",
  "2nd great-grandparents","3rd great-grandparents","4th great-grandparents"];
function renderAncestry(){
  const gens=[]; const seen=new Set(); let layer=[ROOT];
  while(layer.length && gens.length<9){
    const uniq=[];
    for(const x of layer.map(canon)) if(!seen.has(x)){ seen.add(x); uniq.push(x); }
    if(!uniq.length) break;
    gens.push(uniq);
    layer = uniq.flatMap(parentsOf);
  }
  const total = gens.reduce((a,g)=>a+g.length,0)-1;
  el("pane-ancestry").innerHTML =
   `<h1>The ancestry of Grant Kozak</h1>
    <p class="lede">Every generation the records currently support, reading upward &mdash;
      ${total} direct ancestors across ${gens.length-1} generations above him.
      A dashed border means <strong>probable</strong>: the line is there, a document is not.
      Click anyone for their dates, their sources, and every research session that touched them.</p>
    ${gens.map((g,i)=>`<div class="gen">
        <div class="gen-h">${esc(GEN_LABEL[i]||("Generation "+(i+1)))} &middot; ${g.length}</div>
        <div class="row">${g.map(card).join("")}</div></div>`).join("")}
    <div class="note"><strong>Direct ancestry only.</strong> Aunts, uncles, cousins and the
      in-law lines &mdash; including the Appel/Skerry line that married in through David Kozak
      &mdash; are all under <strong>People</strong>. Collateral research that is not Grant's
      descent, notably the McGivney line, is in the full session notes.</div>`;
}

/* ── PEOPLE ────────────────────────────────────────────────────────────── */
function renderPeople(){
  const q=(el("pq").value||"").trim().toLowerCase(), bf=el("pb").value||"";
  const list=ALL.filter(id=>{
    const p=P[id];
    if(bf && (p.branch||"none")!==bf) return false;
    if(!q) return true;
    return (p.name+" "+(p.note||"")+" "+(p.relation||"")+" "+
      (p.facts||[]).map(f=>f.join(" ")).join(" ")).toLowerCase().includes(q);
  }).sort((a,b)=>P[a].name.localeCompare(P[b].name));
  el("people-list").innerHTML = list.length
    ? `<div class="row">${list.map(card).join("")}</div>`
    : `<div class="empty">No one matches that.</div>`;
  el("people-count").textContent = `${list.length} of ${ALL.length} people`;
}
function peopleShell(){
  const LBL={kozak:"Kozak (paternal)",rel:"Relihan (maternal)",shom:"Shomsky / Demchak",
             mcg:"McGivney (collateral)",other:"In-law / other",none:"Unclassified"};
  const branches=[...new Set(ALL.map(branchOf))].sort();
  el("pane-people").innerHTML=
   `<h1>People</h1>
    <p class="lede">Everyone the research has identified &mdash; direct ancestors, their siblings,
      spouses, in-law lines and collateral branches.</p>
    <div class="bar">
      <input type="search" id="pq" placeholder="Search name, place, date, fact…">
      <select id="pb"><option value="">All branches</option>
        ${branches.map(b=>`<option value="${esc(b)}">${esc(LBL[b]||b)}</option>`).join("")}</select>
      <span class="count" id="people-count"></span>
    </div>
    <div id="people-detail"></div>
    <div id="people-list"></div>`;
  el("pq").addEventListener("input",renderPeople);
  el("pb").addEventListener("change",renderPeople);
  renderPeople();
}

const DERIVED = new Set(["parents","children","spouse","spouses"]);
function chips(ids){
  return ids.length
    ? `<div class="rel-list">${ids.map(i=>`<button data-go="${esc(i)}">${esc(nameOf(i))}</button>`).join("")}</div>`
    : `<span style="color:var(--ink3)">not recorded</span>`;
}
function detail(id){
  id=canon(id); const p=P[id]; if(!p) return "";
  const srcs=Object.entries(D.sources)
    .filter(([,s])=>(s.personRefs||[]).some(r=>canon(r)===id))
    .sort((a,b)=>a[1].num-b[1].num);
  const parts=Object.entries(D.parts)
    .filter(([,pt])=>(pt.personRefs||[]).some(r=>canon(r)===id))
    .sort((a,b)=>(b[1].number||0)-(a[1].number||0));
  const par=parentsOf(id), sp=spousesOf(id), kids=childrenOf(id);
  return `<div class="detail">
    <h3>${esc(p.name)}${p.prob?'<span class="chip c-prob">probable</span>':""}
      <span class="chip c-${esc(branchOf(id))}">${esc(branchOf(id))}</span></h3>
    ${p.note?`<div class="sub">${esc(p.note)}</div>`:""}
    <dl class="kv">
      ${p.relation?`<dt>Relation</dt><dd>${esc(p.relation)}</dd>`:""}
      <dt>Parents</dt><dd>${chips(par)}</dd>
      ${sp.length?`<dt>Spouse</dt><dd>${chips(sp)}</dd>`:""}
      ${kids.length?`<dt>Children</dt><dd>${chips(kids)}</dd>`:""}
      ${(p.facts||[]).filter(f=>!DERIVED.has(String(f[0]).trim().toLowerCase()))
          .map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join("")}
    </dl>
    <div class="blk"><h4>Sources (${srcs.length})</h4>
      ${srcs.length?srcs.map(([k,s])=>`<div class="src ${esc(s.confidenceClass||"cp")}">
        <div class="sn">${esc(k)} &middot; ${esc(s.clue||s.person||"")}</div>
        <div class="meta">${esc(s.type||"")} &middot; ${esc(s.citation||"")} &middot; ${esc(s.date||"")} &middot; ${esc(s.confidence||"")}</div>
        ${s.notes?`<div style="font-size:12.5px;color:var(--ink2);margin-top:3px">${esc(s.notes)}</div>`:""}
        ${s.url?`<div style="margin-top:3px"><a href="${esc(s.url)}" target="_blank" rel="noopener">view record</a></div>`:""}
      </div>`).join("")
      :`<span style="color:var(--ink3)">No source cites this person directly yet.</span>`}</div>
    ${parts.length?`<div class="blk"><h4>Research sessions (${parts.length})</h4>
      ${parts.map(([,pt])=>`<div style="font-size:13px;margin-bottom:6px">
        <span class="pn">Part ${esc(pt.number)}</span> &middot; ${esc(pt.date||"")} &mdash; ${esc(pt.title||"")}
      </div>`).join("")}</div>`:""}
  </div>`;
}

/* ── SOURCES ───────────────────────────────────────────────────────────── */
function renderSources(){
  const q=(el("sq").value||"").trim().toLowerCase(), cf=el("sc").value||"";
  const rows=Object.entries(D.sources).filter(([k,s])=>{
    if(cf && (s.confidenceClass||"")!==cf) return false;
    if(!q) return true;
    return (k+" "+[s.person,s.relatedPerson,s.clue,s.type,s.citation,s.notes]
      .filter(Boolean).join(" ")).toLowerCase().includes(q);
  }).sort((a,b)=>b[1].num-a[1].num);
  el("src-count").textContent=`${rows.length} of ${Object.keys(D.sources).length} sources`;
  el("src-body").innerHTML = rows.length ? rows.map(([k,s])=>`<tr>
    <td><strong>${esc(k)}</strong></td>
    <td>${esc(s.person||"")}<div style="color:var(--ink3);font-size:11.5px">${esc(s.relatedPerson||"")}</div></td>
    <td>${esc(s.clue||"")}</td>
    <td>${esc(s.type||"")}<div style="color:var(--ink3);font-size:11.5px">${esc(s.citation||"")}${s.date?" &middot; "+esc(s.date):""}</div></td>
    <td><span class="chip c-${s.confidenceClass==="cc"?"kozak":s.confidenceClass==="ci"?"mcg":"other"}">${esc(s.confidence||"")}</span></td>
  </tr>`).join("") : `<tr><td colspan="5" style="text-align:center;color:var(--ink3);padding:26px">Nothing matches.</td></tr>`;
}
function sourcesShell(){
  el("pane-sources").innerHTML=
   `<h1>Sources &amp; evidence</h1>
    <p class="lede">Every claim on this site should trace to a row here. Newest first.</p>
    <div class="bar">
      <input type="search" id="sq" placeholder="Search person, citation, clue…">
      <select id="sc"><option value="">All confidence</option>
        <option value="cc">Confirmed</option><option value="cp">Probable</option>
        <option value="ci">Disproven / tenuous</option></select>
      <span class="count" id="src-count"></span>
    </div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>Person</th><th>Clue</th><th>Type &amp; citation</th><th>Confidence</th></tr></thead>
      <tbody id="src-body"></tbody></table></div>`;
  el("sq").addEventListener("input",renderSources);
  el("sc").addEventListener("change",renderSources);
  renderSources();
}

/* ── RESEARCH LOG ──────────────────────────────────────────────────────── */
function renderResearch(){
  const parts=Object.entries(D.parts).sort((a,b)=>(b[1].number||0)-(a[1].number||0));
  el("pane-research").innerHTML=
   `<h1>Research log</h1>
    <p class="lede">${parts.length} numbered sessions, newest first, straight from the data.
      For the full working notes &mdash; including dead ends and the collateral McGivney material
      &mdash; see <a href="research-log.html">the full session notes</a>.</p>
    ${parts.map(([,pt])=>`<div class="part">
      <div class="pn">Part ${esc(pt.number)}${pt.date?" &middot; "+esc(pt.date):""}${(pt.sourceRefs||[]).length?" &middot; "+esc((pt.sourceRefs||[]).join(", ")):""}</div>
      <div class="pt">${esc(pt.title||"")}</div>
      ${pt.summary?`<div class="ps">${esc(pt.summary)}</div>`:""}
      ${(pt.personRefs||[]).length?`<div class="rel-list" style="margin-top:9px">
        ${[...new Set((pt.personRefs||[]).map(canon))].map(i=>`<button data-go="${esc(i)}">${esc(nameOf(i))}</button>`).join("")}
      </div>`:""}
    </div>`).join("")}`;
}

/* ── OPEN QUESTIONS — derived, never hand-listed ───────────────────────── */
function renderQuestions(){
  const cited=new Set();
  for(const s of Object.values(D.sources)) for(const r of s.personRefs||[]) cited.add(canon(r));
  const probable = ALL.filter(id=>P[id].prob);
  const unsourced = ALL.filter(id=>!cited.has(id));
  const noParents = ALL.filter(id=>parentsOf(id).length===0);
  const box=(t,d,ids,cap)=>`<h2>${esc(t)} <span style="color:var(--ink3);font-size:14px">${ids.length}</span></h2>
    <p class="lede">${d}</p>
    ${ids.length?`<div class="row">${ids.slice(0,cap).map(card).join("")}</div>
      ${ids.length>cap?`<p class="lede" style="margin-top:8px">…and ${ids.length-cap} more.</p>`:""}`
     :`<div class="empty">None.</div>`}`;
  el("pane-questions").innerHTML=
   `<h1>Open questions</h1>
    <p class="lede">Derived from the data on every page load, so this list cannot go stale the
      way a hand-written one does.</p>
    ${box("Marked probable — needs a document",
      "The relationship is believed but not proven. These are the ones worth an afternoon.",probable,60)}
    ${box("No source cites them",
      "Named somewhere in the research but with no evidence row pointing at them yet.",unsourced,48)}
    ${box("Parents unknown",
      "Where a line currently stops.",noParents,48)}`;
}

/* ── navigation ────────────────────────────────────────────────────────── */
const PANES=["ancestry","people","sources","research","questions"];
function show(name, personId){
  if(!PANES.includes(name)) name="ancestry";
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===name));
  el("pane-"+name).classList.add("on");
  if(name==="people"){
    el("people-detail").innerHTML = personId ? detail(personId) : "";
    if(personId) window.scrollTo({top:0,behavior:"smooth"});
  }
  location.hash = name + (personId?("/"+personId):"");
}
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go) return show("people", go.dataset.go);
  const nb=e.target.closest("nav button");
  if(nb) show(nb.dataset.p);
});

fetch("data/family.json?_="+Date.now()).then(r=>r.json()).then(d=>{
  D=d; P=d.persons;
  ALL = Object.keys(P).filter(id=>canon(id)===id);
  buildKids();
  el("boot").remove();
  renderAncestry(); peopleShell(); sourcesShell(); renderResearch(); renderQuestions();
  const [pane,pid]=(location.hash.replace(/^#/,"")||"ancestry").split("/");
  show(pane,pid);
}).catch(err=>{
  el("boot").innerHTML="Could not load <code>data/family.json</code> &mdash; "+esc(err);
});
</script>
</body>
</html>
